<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f2eb" />
    <title>augustine 官奕愷 — 個人頁面</title>
    <meta name="description" content="我是官奕愷 augustine，通訊工程系。個人介紹、技能與即時時鐘。" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header><a class="mark" href="./" aria-label="Augustine home">a.</a><span class="eyebrow">我的個人小天地</span></header>
    <main>
      <section class="intro" aria-labelledby="name">
        <img class="avatar" src="assets/shinchan-avatar.png" alt="蠟筆小新頭像" width="112" height="112" />
        <div class="eyebrow"><span class="dot"></span> Profile / 關於我</div>
        <h1 id="name">你好，我是<br /><span>augustine.</span></h1>
        <span class="department">通訊工程系</span>
        <p class="bio">我是官奕愷</p>
        <p class="welcome">歡迎來到我的個人頁面。</p>
        <div class="little-line" aria-hidden="true"></div>
      </section>
      <div class="side">
      <section class="skills" aria-labelledby="skills-title">
        <h2 class="eyebrow" id="skills-title">Skills / 技能</h2>
        <ul class="skill-list">
          <li>Python</li>
          <li>Machine Learning</li>
          <li>AI</li>
          <li>Data Analysis</li>
        </ul>
      </section>
      <section class="clock-card" aria-labelledby="clock-title">
        <div class="orbit" aria-hidden="true"></div>
        <div class="card-top"><h2 class="eyebrow" id="clock-title">Live Clock / 即時時鐘</h2><span class="live"><span class="dot"></span>LIVE</span></div>
        <div class="clock-content">
          <div class="time-row"><time id="time">-- : -- : --</time></div>
          <div id="date">正在載入當地時間…</div>
        </div>
        <div class="zone"><span aria-hidden="true">◎</span><span id="zone">瀏覽器所在時區</span></div>
      </section>
      </div>
    </main>
    <footer><span>© <span id="year">2026</span> Augustine</span><span>把握現在的每一刻。</span></footer>
    <script src="app.js"></script>
  </body>
</html>
